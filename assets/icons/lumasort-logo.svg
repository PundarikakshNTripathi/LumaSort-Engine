<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="70%" stop-color="#11111b" />
      <stop offset="100%" stop-color="#0b0b12" />
    </radialGradient>

    <!-- Core Luminous Gradients -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f472b6;#fbbf24;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f43f5e;#38bdf8;#a855f7;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#38bdf8;#fbbf24;#c084fc;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .orbit-cw {
        transform-origin: 256px 256px;
        animation: spinCW 14s linear infinite;
      }
      .orbit-ccw {
        transform-origin: 256px 256px;
        animation: spinCCW 20s linear infinite;
      }
      .pulse-glow {
        transform-origin: 256px 256px;
        animation: breathe 4s ease-in-out infinite;
      }
      .flow-dash {
        stroke-dasharray: 12 18;
        animation: dashStream 6s linear infinite;
      }
      .flow-dash-rev {
        stroke-dasharray: 8 14;
        animation: dashStreamRev 8s linear infinite;
      }
      .particle-float {
        animation: pFloat 3s ease-in-out infinite alternate;
      }

      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashStream {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 300; }
      }
      @keyframes dashStreamRev {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.035); opacity: 1; }
      }
      @keyframes pFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Base Rounded Squircle with Subtle Rim Light -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="2.5" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#prismGrad)" stroke-width="1.2" opacity="0.35" />

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="256" r="140" fill="url(#prismGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Orbiting Fluid Dynamics Sorting Rings -->
  <g class="orbit-cw">
    <ellipse cx="256" cy="256" rx="168" ry="86" fill="none" stroke="url(#orbitGrad1)" stroke-width="2" transform="rotate(-28 256 256)" class="flow-dash" opacity="0.85" />
    <!-- Floating Sorting Particles on Ring 1 -->
    <circle cx="95" cy="230" r="4.5" fill="#38bdf8" filter="url(#particleGlow)" />
    <circle cx="417" cy="282" r="5" fill="#f43f5e" filter="url(#particleGlow)" />
    <circle cx="230" cy="172" r="3.5" fill="#c084fc" />
    <circle cx="282" cy="340" r="4" fill="#fbbf24" />
  </g>

  <g class="orbit-ccw">
    <ellipse cx="256" cy="256" rx="180" ry="94" fill="none" stroke="url(#orbitGrad2)" stroke-width="1.8" transform="rotate(42 256 256)" class="flow-dash-rev" opacity="0.75" />
    <!-- Floating Sorting Particles on Ring 2 -->
    <circle cx="390" cy="180" r="4" fill="#38bdf8" />
    <circle cx="122" cy="332" r="4.5" fill="#f472b6" filter="url(#particleGlow)" />
    <circle cx="270" cy="162" r="3" fill="#a855f7" />
    <circle cx="242" cy="350" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Central Dynamic "L" Prism Monogram (LumaSort Engine Emblem) -->
  <g class="pulse-glow" filter="url(#glow)">
    <!-- Back Luminescent Shadow -->
    <path d="M 194 136 L 226 136 L 226 332 L 338 332 L 338 368 L 194 368 Z" fill="#000000" opacity="0.4" transform="translate(4, 6)" />

    <!-- Stylized Modern LumaSort 'L' / Sorting Flow Monogram -->
    <!-- Vertical Stalk: High Luminance Stream -->
    <path d="M 186 142 C 186 133 193 126 202 126 L 226 126 C 235 126 242 133 242 142 L 242 322 L 332 322 C 341 322 348 329 348 338 L 348 360 C 348 369 341 376 332 376 L 202 376 C 193 376 186 369 186 360 Z" 
          fill="url(#prismGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Internal Optical Refraction Facet -->
    <path d="M 204 142 L 224 142 L 224 338 L 330 338 L 314 360 L 204 360 Z" 
          fill="#ffffff" opacity="0.18" />

    <!-- Sorting Grid Accent Lines inside L -->
    <line x1="202" y1="184" x2="226" y2="184" stroke="#ffffff" stroke-width="2" opacity="0.5" />
    <line x1="202" y1="230" x2="226" y2="230" stroke="#ffffff" stroke-width="2" opacity="0.65" />
    <line x1="202" y1="276" x2="226" y2="276" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="260" y1="338" x2="260" y2="360" stroke="#ffffff" stroke-width="2" opacity="0.7" />
    <line x1="294" y1="338" x2="294" y2="360" stroke="#ffffff" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Luminous Sorted Photons (Foreground Energy Constellation) -->
  <g class="particle-float">
    <!-- Bright sorted focal points -->
    <circle cx="214" cy="126" r="6" fill="#ffffff" filter="url(#particleGlow)" />
    <circle cx="348" cy="349" r="6" fill="#ffffff" filter="url(#particleGlow)" />
    <circle cx="186" cy="351" r="5" fill="#f43f5e" filter="url(#particleGlow)" />
    
    <!-- Micro Photons / Sparkles -->
    <circle cx="160" cy="190" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="356" cy="190" r="3" fill="#c084fc" opacity="0.7" />
    <circle cx="320" cy="270" r="2.5" fill="#fbbf24" opacity="0.85" />
    <circle cx="168" cy="300" r="3" fill="#f472b6" opacity="0.75" />
  </g>
</svg>
